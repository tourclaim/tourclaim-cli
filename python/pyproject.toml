[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tourclaim"
dynamic = ["version"]
description = "Client and command line for TourClaim: start, fill in and submit a trip cancellation claim against the travel insurance that comes with your credit card, from Python, a terminal or an AI agent."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Copernican", email = "info@getcopernican.com" }]
keywords = [
    "tourclaim",
    "copernican",
    "travel insurance",
    "trip cancellation",
    "trip interruption",
    "claims",
    "insurance claims",
    "credit card benefits",
    "ai agents",
    "agent tools",
    "cli",
    "sdk",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/tourclaim/tourclaim-cli"
Documentation = "https://github.com/tourclaim/tourclaim-cli/tree/main/python#readme"
Issues = "https://github.com/tourclaim/tourclaim-cli/issues"
Changelog = "https://github.com/tourclaim/tourclaim-cli/blob/main/python/CHANGELOG.md"

[project.scripts]
tourclaim = "tourclaim.cli:main"

[tool.hatch.version]
path = "src/tourclaim/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tourclaim"]

[tool.hatch.build.targets.sdist]
include = [
    "src/tourclaim",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "RELEASING.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = ["__pycache__", "*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
