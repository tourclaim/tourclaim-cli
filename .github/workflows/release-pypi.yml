name: Release to PyPI

# Publishes the Python edition (python/) when a version tag is pushed, with
# PyPI trusted publishing: no token is stored. See python/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install the package and the build tools
        run: python -m pip install -e "python[dev]" build twine
      - name: Run the tests
        run: python -m pytest python/tests -q
      - name: Check the tag matches the package version
        run: |
          version="$(python -c 'import tourclaim; print(tourclaim.__version__)')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match tourclaim.__version__ ${version}. Nothing was published."
            exit 1
          fi
      - name: Build the sdist and wheel
        run: python -m build python
      - name: Check the distributions
        run: python -m twine check --strict python/dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist
          path: python/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tourclaim/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
