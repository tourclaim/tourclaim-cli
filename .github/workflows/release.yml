name: Release

# Publishes to npm when a version tag is pushed (npm version <x> && git push --follow-tags).
# Uses npm trusted publishing: no token is stored; npm checks this workflow's
# OIDC identity against the trusted publisher set up on npmjs.com. See RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install an npm with trusted publishing (11.5.1 or newer)
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version." >&2
            exit 1
          fi
      - run: npm publish --provenance --access public
